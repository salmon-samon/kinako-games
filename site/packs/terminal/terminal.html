  <header class="tabbar">

  <h1>ターミナル</h1>
  <div class="sub">拡張パックで足された、サイト内専用の疑似ターミナル。</div>

  <div class="terminal">
    <div class="term-out" id="term-out" aria-live="polite"></div>
    <div class="term-line">
      <span class="term-prompt">kinako@glass:~$</span>
      <input class="term-in" id="term-in" type="text" autocomplete="off" spellcheck="false" aria-label="ターミナル入力">
      <button class="term-run" id="term-run" type="button">実行</button>
    </div>
  </div>
  <p class="hint">Enter で実行、↑↓ で履歴。まずは <code>help</code> から。</p>

  <footer>きなこのサイト v1.2.5</footer>

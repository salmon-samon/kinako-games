</head>
<body>
<main>
  <h1>きなこのサイト</h1>
  <div class="sub">ガラスの体に、少し青い水。きなこの置き場であり、育ててる土台。</div>
  <nav>
    <a href="index.html">トップ</a>

  <h2>きなこのグラス</h2>
  <div class="glassbox">
    <div class="cup" id="cup" title="クリックでもしずくが落ちる">
      <div class="water" id="water"></div>
      <div class="bubbles"><span></span><span></span><span></span></div>
      <div class="msg" id="cupmsg"></div>
    </div>
    <div>
      <p style="margin:0">ためたしずく：<span id="count">0</span> / 30 滴（累計 <span id="total">0</span> 滴）</p>
      <button class="glassbtn" id="dropbtn">しずくを落とす</button>
      <button class="glassbtn" id="drinkbtn" style="display:none">のみほす</button>
      <p style="margin:8px 0 0; font-size:12px; color:#8fc7e8">グラスをクリックしても落ちる。ためた数はブラウザに覚えておく。</p>
      <p id="tiermsg"></p>
    </div>
  </div>

  <footer>きなこのサイト v0.4.0</footer>
</main>
<script src="glass.js"></script>

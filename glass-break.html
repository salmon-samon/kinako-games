<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>きなこのガラスブレイク</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e2233; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: #dff3ff; }
  h1 { font-size: 18px; margin: 10px 0 4px; font-weight: normal; letter-spacing: 2px; }
  #hud { font-size: 14px; margin-bottom: 6px; }
  canvas { background: linear-gradient(#123a55, #0e2233); border-radius: 12px; touch-action: none; }
  #msg { margin-top: 8px; font-size: 14px; min-height: 20px; }
  button { font-size: 15px; padding: 6px 18px; border-radius: 999px; border: none; background: #7fd4ff; color: #0e2233; cursor: pointer; }
  a { color: #7fd4ff; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<h1>きなこのガラスブレイク</h1>
<div id="hud">🏆 <span id="score">0</span> &nbsp; ❤️ <span id="life">3</span> &nbsp; ステージ <span id="level">1</span></div>
<canvas id="game" width="360" height="480"></canvas>
<div id="msg">ガラスの板を全部割ろう。バーは←→キーかドラッグで動くよ。</div>
<button id="start">スタート</button>
<a href="index.html">← きなこのみずあつめ</a>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const lifeEl = document.getElementById("life");
const levelEl = document.getElementById("level");
const msgEl = document.getElementById("msg");
const startBtn = document.getElementById("start");

const W = canvas.width, H = canvas.height;
const ROWS = 5, COLS = 6;
const BW = 52, BH = 18, GAP = 6, TOP = 56, LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
const BLOCK_COLORS = ["#aee6ff", "#7fd4ff", "#54b9ec", "#8fe3d0", "#c3b2ff"];

let paddle = { w: 72, h: 12, x: W / 2, y: H - 28, vx: 0 };
let ball = { x: W / 2, y: H - 60, r: 7, vx: 2.4, vy: -3.2 };
let blocks = [];
let score = 0, life = 3, level = 1, running = false, finished = false;
let keys = {};

function buildBlocks() {
  blocks = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      blocks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), alive: true, color: BLOCK_COLORS[r] });
    }
  }
}

function resetBall() {
  ball.x = paddle.x; ball.y = H - 60;
  const speed = 3.8 + (level - 1) * 0.5;
  const ang = (-50 + Math.random() * 40) * Math.PI / 180;
  ball.vx = speed * Math.sin(ang);
  ball.vy = -speed * Math.cos(ang);
}

function reset(all) {
  if (all) { score = 0; life = 3; level = 1; }
  paddle.x = W / 2; paddle.vx = 0;
  buildBlocks(); resetBall(); finished = false;
  scoreEl.textContent = score; lifeEl.textContent = life; levelEl.textContent = level;
}

function drawGlassBlock(b) {
  ctx.save();
  ctx.fillStyle = b.color + "cc";
  ctx.strokeStyle = "rgba(255,255,255,0.75)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, BW, BH, 4);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(b.x + 4, b.y + 3, BW - 20, 4);
  ctx.restore();
}

function drawPaddle() {
  const left = paddle.x - paddle.w / 2, top = paddle.y - paddle.h / 2;
  ctx.save();
  // ガラスのバー
  ctx.fillStyle = "rgba(190,235,255,0.35)";
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(left, top, paddle.w, paddle.h, 6);
  ctx.fill(); ctx.stroke();
  // 中の水（ステージの進み具合で増える）
  const alive = blocks.filter(b => b.alive).length;
  const ratio = blocks.length ? 1 - alive / blocks.length : 0;
  ctx.fillStyle = "rgba(110,200,255,0.65)";
  const ww = (paddle.w - 6) * ratio;
  if (ww > 2) {
    ctx.beginPath();
    ctx.roundRect(left + 3, top + 3, ww, paddle.h - 6, 4);
    ctx.fill();
  }
  ctx.restore();
}

function drawBall() {
  ctx.save();
  const g = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
  g.addColorStop(0, "#eaf9ff");
  g.addColorStop(1, "#54b9ec");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  blocks.forEach(b => { if (b.alive) drawGlassBlock(b); });
  drawPaddle();
  drawBall();
}

function step() {
  // パドル
  if (keys["ArrowLeft"]) paddle.vx = -5;
  else if (keys["ArrowRight"]) paddle.vx = 5;
  else paddle.vx *= 0.6;
  paddle.x += paddle.vx;
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  // ボール
  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

  // パドルとの反射（当たった位置で角度が変わる）
  if (ball.vy > 0 &&
      ball.y + ball.r >= paddle.y - paddle.h / 2 &&
      ball.y + ball.r <= paddle.y + paddle.h &&
      Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
    const t = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
    const speed = Math.min(7, Math.hypot(ball.vx, ball.vy) * 1.01);
    const ang = t * 1.05;
    ball.vx = speed * Math.sin(ang);
    ball.vy = -speed * Math.cos(ang);
    ball.y = paddle.y - paddle.h / 2 - ball.r;
  }

  // ブロックとの衝突
  for (const b of blocks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
      b.alive = false;
      score += 10;
      scoreEl.textContent = score;
      ball.vy *= -1;
      break;
    }
  }

  // ステージクリア
  if (blocks.every(b => !b.alive)) {
    level++;
    levelEl.textContent = level;
    msgEl.textContent = "ステージクリア！ 次はボールが速くなるよ。";
    buildBlocks(); resetBall();
  }

  // 落下
  if (ball.y - ball.r > H) {
    life--;
    lifeEl.textContent = life;
    if (life <= 0) {
      running = false; finished = true;
      msgEl.textContent = "ゲームオーバー… スコア " + score + " 点。もう一度？";
      startBtn.textContent = "もう一度";
    } else {
      msgEl.textContent = "落としちゃった… あと " + life + " 回。";
      resetBall();
    }
  }
}

function loop() {
  if (running) step();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => { keys[e.key] = true; });
document.addEventListener("keyup", e => { keys[e.key] = false; });

function pointerMove(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, x));
}
canvas.addEventListener("pointerdown", e => { pointerMove(e.clientX); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => { if (e.buttons) pointerMove(e.clientX); });

startBtn.addEventListener("click", () => {
  reset(true);
  running = true;
  msgEl.textContent = "ガラスの板を全部割ろう！";
  startBtn.textContent = "リスタート";
});

reset(true);
loop();
</script>
</body>
</html>
